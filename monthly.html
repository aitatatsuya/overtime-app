<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>月次残業集計</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #fff;
      color: #222;
    }

    .container {
      padding: 6px;
      max-width: 100%;
    }

    h1 {
      font-size: 28px;
      text-align: center;
      color: #4A90E2;
      margin: 6px 0 10px;
    }

    .nav {
      text-align: center;
      margin-bottom: 10px;
    }

    .nav a {
      color: #4A90E2;
      text-decoration: none;
      border: 2px solid #4A90E2;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 16px;
    }

    /* 行 */
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }

    .hour {
      width: 72px;
      text-align: right;
      font-size: 20px;
      font-weight: 600;
      color: #4A90E2;
      white-space: nowrap;
    }

    select {
      height: 40px;
      font-size: 18px;
      border-radius: 8px;
      border: 2px solid #bbb;
      background: #fff;
    }

    .count {
      width: 90px;
      text-align: center;
    }

    .remove-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: #ccc;
      font-size: 18px;
    }

    .add-btn {
      width: 100%;
      margin: 8px 0 4px;
      padding: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #4A90E2;
      color: #fff;
    }

    .total {
      border-top: 2px solid #ccc;
      margin-top: 4px;
      padding-top: 6px;
      color: #4A90E2;
    }

    .total-row {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .clear-btn {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #999;
      color: #fff;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>月次残業集計</h1>

  <div class="nav">
    <a href="index.html">日次残業計算へ</a>
  </div>

  <!-- 固定行 -->
  <div id="rows">
    <!-- JSで生成 -->
  </div>

  <button class="add-btn" id="addRowBtn">＋ 行を追加</button>

  <div class="total">
    <div class="total-row">
      回数合計： <span id="totalCount">0</span> 回
    </div>
    <div class="total-row">
      残業合計： <span id="totalHour">0.00</span> h
    </div>

    <button class="clear-btn" id="clearBtn">クリア</button>
  </div>

</div>

<script>
const rows = document.getElementById('rows');
const totalCountEl = document.getElementById('totalCount');
const totalHourEl = document.getElementById('totalHour');
const addRowBtn = document.getElementById('addRowBtn');
const clearBtn = document.getElementById('clearBtn');

const fixedHours = [0.25,0.5,0.75,1,1.25,1.5];

function createRow(hour, removable=false) {
  const row = document.createElement('div');
  row.className = 'row';

  const hourEl = document.createElement(removable ? 'select' : 'div');
  hourEl.className = 'hour';

  if (removable) {
    for (let h = 1.75; h <= 4.0001; h += 0.25) {
      const opt = document.createElement('option');
      opt.value = h.toFixed(2);
      opt.textContent = h.toFixed(2) + 'h';
      hourEl.appendChild(opt);
    }
    hourEl.value = '1.75';
  } else {
    hourEl.textContent = hour.toFixed(2) + 'h';
  }

  const count = document.createElement('select');
  count.className = 'count';
  const empty = document.createElement('option');
  empty.value = '';
  empty.textContent = '';
  count.appendChild(empty);
  for (let i=1;i<=25;i++){
    const o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    count.appendChild(o);
  }

  row.appendChild(hourEl);
  row.appendChild(document.createTextNode('×'));
  row.appendChild(count);

  if (removable) {
    const del = document.createElement('button');
    del.textContent = '−';
    del.className = 'remove-btn';
    del.onclick = () => { row.remove(); calculate(); };
    row.appendChild(del);
  }

  count.oninput = calculate;
  if (removable) hourEl.onchange = calculate;

  rows.appendChild(row);
}

function calculate() {
  let c=0, h=0;
  document.querySelectorAll('.row').forEach(r=>{
    const cnt = parseInt(r.querySelector('.count')?.value);
    if (!cnt) return;
    const hourEl = r.querySelector('.hour');
    const hour = hourEl.tagName === 'SELECT'
      ? parseFloat(hourEl.value)
      : parseFloat(hourEl.textContent);
    c += cnt;
    h += hour * cnt;
  });
  totalCountEl.textContent = c;
  totalHourEl.textContent = h.toFixed(2);
}

// 初期化
fixedHours.forEach(h => createRow(h,false));
createRow(1.75,true);

addRowBtn.onclick = () => createRow(1.75,true);

clearBtn.onclick = () => {
  document.querySelectorAll('.count').forEach(s=>s.value='');
  document.querySelectorAll('.row select.hour')?.forEach(s=>s.value='1.75');
  calculate();
};
</script>

</body>
</html>
