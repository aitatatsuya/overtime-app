<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>残業計算</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">

<style>

/* ==============================
   基本
   ============================== */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background-color: #ffffff;
  color: #222;
}

.container {
  min-height: 100vh;
  padding: 12px;
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* ==============================
   タイトル・ナビ（元のサイズ感）
   ============================== */
h1 {
  font-size: 34px;
  font-weight: 600;
  text-align: center;
  margin: 8px 0 20px;
  color: #4A90E2;
}

.nav-link-wrapper {
  text-align: center;
  margin-bottom: 12px;
}

.nav-link {
  display: inline-block;
  padding: 12px 18px;
  font-size: 20px;
  color: #4A90E2;
  text-decoration: none;
  border: 2px solid #4A90E2;
  border-radius: 14px;
}

/* ==============================
   入力
   ============================== */
.input-group {
  margin-bottom: 14px;
}

label {
  font-size: 22px;
  font-weight: 500;
  color: #444;
}

input[type="time"] {
  width: 100%;
  box-sizing: border-box;
  font-size: 46px;
  padding: 14px 16px;
  margin-top: 6px;
  border: 2px solid #bbb;
  border-radius: 18px;
}

/* ==============================
   ボタン
   ============================== */
.buttons {
  display: flex;
  gap: 14px;
  margin: 18px 0;
}

button {
  flex: 1;
  padding: 22px;
  font-size: 30px;
  border: none;
  border-radius: 20px;
  background-color: #4A90E2;
  color: #fff;
}

button#clearBtn {
  background-color: #999;
}

/* ==============================
   結果表示
   ============================== */
.result-card {
  margin-top: 16px;
  padding: 24px;
  border-radius: 22px;
  background-color: #f6f8fb;
}

.result-row {
  display: flex;
  justify-content: space-between;
  font-size: 34px;
  margin-bottom: 18px;
  color: #4A90E2;
}

.result-row span:last-child {
  font-size: 38px;
  font-weight: 600;
}

.total {
  font-size: 44px;
  font-weight: bold;
  border-top: 2px solid #ccc;
  padding-top: 18px;
  margin-top: 18px;
  color: #4A90E2;
}

/* ==============================
   補足
   ============================== */
.note,
.half-note {
  font-size: 17px;
  color: #666;
  margin: 14px 0;
}

.footer {
  margin-top: 48px;
  font-size: 18px;
  color: #555;
}

.version {
  text-align: right;
  font-size: 15px;
  color: #999;
  margin-top: 14px;
}

/* ==============================
   クリアアニメーション
   ============================== */
.result-number {
  display: inline-block;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.result-number.reset-out {
  transform: translateY(10px);
  opacity: 0;
}

.result-number.reset-in {
  transform: translateY(-10px);
  opacity: 0;
}

</style>

</head>

<body>
  <div class="container">
    <div>
      <h1>日次残業計算</h1>

      <div class="nav-link-wrapper">
        <a href="monthly.html" class="nav-link">月次残業集計へ</a>
      </div>

      
      <div class="input-group">
        <label>出勤</label>
        <input type="time" id="startTime">
      </div>

      <div class="input-group">
        <label>午前退勤</label>
        <input type="time" id="amLeave">
      </div>

      <div class="input-group">
        <label>午後出勤</label>
        <input type="time" id="pmStart">
      </div>

      <div class="input-group">
        <label>退勤</label>
        <input type="time" id="endTime">
      </div>

      <p class="note">
        ※ 入力された時間に応じて、該当する残業のみ計算されます
      </p>

      <div class="buttons">
        <button id="calcBtn">計算</button>
        <button id="clearBtn">クリア</button>
      </div>

      <div class="result-card">
  <div class="result-row">
    <span>早出残業</span>
    <span><span id="earlyResult" class="result-number">0.00</span> h</span>
  </div>
  <div class="result-row">
    <span>昼休憩残業</span>
    <span><span id="lunchResult" class="result-number">0.00</span> h</span>
  </div>
  <div class="result-row">
    <span>退勤後残業</span>
    <span><span id="afterResult" class="result-number">0.00</span> h</span>
  </div>

  <div class="half-note" id="halfHolidayNote" style="display:none;">
    ※ 午後半休相当として 12:30 を基準に計算しています
  </div>

  <div class="result-row total">
    <span>合計</span>
    <span><span id="totalResult" class="result-number">0.00</span> h</span>
  </div>
</div>
    </div>

    <!-- 👇 ここから下はスクロールしないと見えない -->
    <div>
      <div class="footer">
        <strong>【ヘルプ】</strong><br>
        ・早出残業は 8:00〜8:14 出勤時のみ 0.25h<br>
        ・昼休憩残業は午前退勤と午後出勤の間隔で計算<br>
        ・退勤が未入力で午前退勤のみの場合、午後半休相当
      </div>

      <div class="version">
        日次 v1.0（完成版）
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
