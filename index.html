<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>残業計算</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">

<style>

/* ==============================
   画面切り替えリンク
   ============================== */

.nav-link {
  display: inline-block;   /* ← ここが重要 */
  padding: 12px 18px;
  margin: 12px auto 20px;
  font-size: 20px;
  color: #4A90E2;
  text-decoration: none;
  border: 2px solid #4A90E2;
  border-radius: 14px;
}

.nav-link-wrapper {
  text-align: center;
}  

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background-color: #ffffff;
    color: #222;
  }

  .container {
    min-height: 100vh;
    padding: 12px;
    max-width: 430px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  h1 {
    font-size: 34px;
    font-weight: 600;
    text-align: center;
    margin: 8px 0 20px;
    color: #4A90E2;
  }

  .input-group {
    margin-bottom: 14px;
  }

  /* ラベル */
  label {
    font-size: 22px;
    font-weight: 500;
    color: #444;
  }

  /* 時刻入力枠（縦 約8mm） */
  input[type="time"] {
    width: 100%;
    box-sizing: border-box;
    font-size: 46px;               /* ← 数字を1サイズUP */
    padding: 14px 16px;            /* ← 縦を縮める */
    margin-top: 6px;
    border: 2px solid #bbb;
    border-radius: 18px;
  }

  .note {
    font-size: 17px;
    color: #666;
    margin: 14px 0;
  }

  .buttons {
    display: flex;
    gap: 14px;
    margin: 18px 0;
  }

  button {
    flex: 1;
    padding: 22px;
    font-size: 30px;
    border: none;
    border-radius: 20px;
    background-color: #4A90E2;
    color: #fff;
  }

  button#clearBtn {
    background-color: #999;
  }

  /* 結果カード */
  .result-card {
    margin-top: 16px;
    padding: 24px;
    border-radius: 22px;
    background-color: #f6f8fb;
  }

  /* 結果行（項目） */
  .result-row {
    display: flex;
    justify-content: space-between;
    font-size: 34px;               /* ← 項目を1サイズUP */
    margin-bottom: 18px;
    color: #4A90E2;                /* ← ブルー */
  }

  /* 結果の数値 */
  .result-row span:last-child {
    font-size: 38px;               /* ← 数値を1サイズUP */
    font-weight: 600;
    color: #4A90E2;                /* ← ブルー */
  }

  .half-note {
    font-size: 17px;
    color: #666;
    margin: 10px 0 6px;
  }

  /* 合計 */
  .total {
    font-size: 44px;               /* ← 合計を1サイズUP */
    font-weight: bold;
    border-top: 2px solid #ccc;
    padding-top: 18px;
    margin-top: 18px;
    color: #4A90E2;                /* ← ブルー */
  }

  .footer {
    margin-top: 48px;
    font-size: 18px;
    color: #555;
  }

  .version {
    text-align: right;
    font-size: 15px;
    color: #999;
    margin-top: 14px;
  }


/* ===== クリア時：数値だけリセット演出 ===== */
.result-number {
  display: inline-block;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.result-number.reset-out {
  transform: translateY(10px);
  opacity: 0;
}

.result-number.reset-in {
  transform: translateY(-10px);
  opacity: 0;
}

/* ==============================
   月次ページとサイズを統一
   ============================== */

/* タイトル */
h1 {
  font-size: 22px;
  margin: 8px 0 10px;
}

/* ナビリンク */
.nav a {
  font-size: 14px;
  padding: 4px 10px;
}

/* ==============================
   月次ページと完全に統一
   ============================== */

h1 {
  font-size: 22px;
  font-weight: 600;      /* ← これが重要 */
  margin: 8px 0 10px;

}

.nav a {
  font-size: 14px;
  padding: 4px 10px;
  border: 2px solid #4A90E2;
}

/* ===== ページ全体の基準を統一 ===== */
html {
  font-size: 16px;
}

body {
  font-size: 16px;
  transform: none;
  zoom: 1;
}

.container {
  max-width: 100%;
  padding: 4px;
}

</style>

</head>

<body>
  <div class="container">
    <div>
      <h1>日次残業計算</h1>

      <div class="nav-link-wrapper">
        <a href="monthly.html" class="nav-link">月次残業集計へ</a>
      </div>

      
      <div class="input-group">
        <label>出勤</label>
        <input type="time" id="startTime">
      </div>

      <div class="input-group">
        <label>午前退勤</label>
        <input type="time" id="amLeave">
      </div>

      <div class="input-group">
        <label>午後出勤</label>
        <input type="time" id="pmStart">
      </div>

      <div class="input-group">
        <label>退勤</label>
        <input type="time" id="endTime">
      </div>

      <p class="note">
        ※ 入力された時間に応じて、該当する残業のみ計算されます
      </p>

      <div class="buttons">
        <button id="calcBtn">計算</button>
        <button id="clearBtn">クリア</button>
      </div>

      <div class="result-card">
  <div class="result-row">
    <span>早出残業</span>
    <span><span id="earlyResult" class="result-number">0.00</span> h</span>
  </div>
  <div class="result-row">
    <span>昼休憩残業</span>
    <span><span id="lunchResult" class="result-number">0.00</span> h</span>
  </div>
  <div class="result-row">
    <span>退勤後残業</span>
    <span><span id="afterResult" class="result-number">0.00</span> h</span>
  </div>

  <div class="half-note" id="halfHolidayNote" style="display:none;">
    ※ 午後半休相当として 12:30 を基準に計算しています
  </div>

  <div class="result-row total">
    <span>合計</span>
    <span><span id="totalResult" class="result-number">0.00</span> h</span>
  </div>
</div>
    </div>

    <!-- 👇 ここから下はスクロールしないと見えない -->
    <div>
      <div class="footer">
        <strong>【ヘルプ】</strong><br>
        ・早出残業は 8:00〜8:14 出勤時のみ 0.25h<br>
        ・昼休憩残業は午前退勤と午後出勤の間隔で計算<br>
        ・退勤が未入力で午前退勤のみの場合、午後半休相当
      </div>

      <div class="version">
        v1.2
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
